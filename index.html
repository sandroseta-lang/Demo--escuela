<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Galería de Videos</title>
    <style>
        /* --- ESTILOS GENERALES --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #000;
        }

        /* --- PANTALLA DE CARGA (LOADER) --- */
       /* --- PANTALLA DE CARGA (LOADER) --- */
#loader {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background-color: #000000; /* <--- ¡Este es el único cambio! */
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 9999;
    transition: opacity 0.5s ease;
}

        #loader img {
            max-width: 150px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        /* --- ESTRUCTURA PRINCIPAL --- */
        #app {
            display: none; /* Oculto hasta que termine la carga */
            padding-bottom: 80px; /* Espacio para el footer */
        }

        /* --- CABECERA --- */
        header {
            display: flex;
            align-items: center;
            padding: 15px 20px;
            gap: 15px;
            background-color: #fff;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        #home-icon {
            width: 40px;
            height: auto;
            cursor: pointer;
        }

        .search-container {
            flex-grow: 1;
            display: flex;
            align-items: center;
            border: 1px solid #ccc;
            border-radius: 25px;
            padding: 5px 15px;
            background-color: #f9f9f9;
        }

        .search-container input {
            border: none;
            outline: none;
            flex-grow: 1;
            padding: 8px;
            background: transparent;
            font-size: 16px;
        }

        .icon {
            font-size: 18px;
            color: #666;
            cursor: pointer;
        }

        /* --- CONTENEDOR DE VIDEOS --- */
        main {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 15px;
            padding: 15px 20px;
        }

        .video-card {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .video-card video {
            width: 100%;
            border-radius: 12px;
            object-fit: cover;
            background-color: #000;
        }

        .video-info {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .video-title {
            font-size: 14px;
            font-weight: bold;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .video-options {
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            padding-left: 5px;
        }

        /* --- MENÚ INFERIOR (FOOTER) --- */
        footer {
            position: fixed;
            bottom: 0;
            width: 100%;
            height: 70px;
            background-color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 60px;
            border-top: 1px solid #eee;
            z-index: 100;
        }

        .add-btn {
            width: 45px;
            height: 45px;
            background-color: #000;
            color: #fff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            font-weight: bold;
            cursor: pointer;
        }

        .profile-icon {
            width: 40px;
            height: 40px;
            border: 2px solid #000;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            overflow: hidden;
            cursor: pointer;
        }
        
        .profile-icon::before {
            content: '';
            width: 20px;
            height: 20px;
            background-color: #000;
            border-radius: 50%;
            margin-bottom: 2px;
        }

    </style>
</head>
<body>

    <!-- Pantalla de Carga -->
    <div id="loader">
        <img src="logo.PNG" alt="Cargando Logo">
    </div>

    <!-- Contenido de la Web -->
    <div id="app">
        <header>
            <img src="casita.PNG" alt="Inicio" id="home-icon">
            <div class="search-container">
                <span class="icon">🔍</span>
                <input type="text" id="searchInput" placeholder="Buscar video...">
                <span class="icon">🎤</span>
            </div>
        </header>

        <main id="videoGrid">
            <!-- Los videos se insertarán aquí con JavaScript -->
        </main>

        <footer>
            <div class="add-btn">+</div>
            <div class="profile-icon"></div>
        </footer>
    </div>

    <script>
        // 1. TRANSICIÓN DE PANTALLA DE CARGA
        window.addEventListener('load', () => {
            setTimeout(() => {
                const loader = document.getElementById('loader');
                const app = document.getElementById('app');
                
                loader.style.opacity = '0';
                
                setTimeout(() => {
                    loader.style.display = 'none';
                    app.style.display = 'block';
                }, 500); // Espera a que termine la transición de opacidad
            }, 2000); // La pantalla de carga dura 2 segundos
        });

        // 2. LISTA DE VIDEOS (Debes escribir el nombre de tus archivos .mp4 aquí)
        // NOTA: Javascript local no puede escanear carpetas, debes definirlos en esta lista.
        const videoFiles = [
            "https://youtu.be/uuA0mdvvabs",
            "https://youtu.be/2HOclB0C378",
            "https://youtu.be/uABNkjOTLEA",
            "https://youtu.be/L5PyGFWFDls",
            "https://youtu.be/7hvFzOEz8-Q",
            "https://youtu.be/remwwDG99EA"
            // Añade más nombres de archivo separados por comas
        ];

        const videoGrid = document.getElementById('videoGrid');
        const searchInput = document.getElementById('searchInput');

        // 3. FUNCIÓN PARA MOSTRAR LOS VIDEOS
        function renderVideos(filterText = "") {
            videoGrid.innerHTML = ""; // Limpiar galería

            // Filtrar videos según lo que se escriba en el buscador
            const filteredVideos = videoFiles.filter(video => 
                video.toLowerCase().includes(filterText.toLowerCase())
            );

            if (filteredVideos.length === 0) {
                videoGrid.innerHTML = "<p>No se encontraron videos.</p>";
                return;
            }

            // Crear el HTML para cada video
            filteredVideos.forEach(fileName => {
                // Formatear el nombre para usarlo de título (quitar el .mp4)
                const title = fileName.replace('.mp4', '').replace(/_/g, ' ');

                const card = document.createElement('div');
                card.className = 'video-card';
                card.innerHTML = `
                    <video src="${fileName}" controls preload="metadata"></video>
                    <div class="video-info">
                        <div class="video-title">${title}</div>
                        <div class="video-options">⋮</div>
                    </div>
                `;
                videoGrid.appendChild(card);
            });
        }

        // Mostrar todos los videos al iniciar
        renderVideos();

        // 4. FUNCIÓN DEL BUSCADOR
        searchInput.addEventListener('input', (e) => {
            renderVideos(e.target.value);
        });
    </script>

</body>
</html>
